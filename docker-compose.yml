x-consumer: &consumer
  build:
    context: .
    args:
      APP: entregador
  env_file:
    - path: .env
      required: false
  environment:
    DELIVERY_BROKER_HOSTS: kafka:9092
    MONGODB_URI: mongodb://mongodb:27017
  depends_on:
    kafka-init-topics:
      condition: service_completed_successfully
    mongodb:
      condition: service_started
  restart: unless-stopped

services:
  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://kafka:9092,CONTROLLER://kafka:9093,PLAINTEXT_HOST://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    restart: unless-stopped

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    restart: unless-stopped

  kafka-init-topics:
    image: apache/kafka:3.9.0
    depends_on:
      - kafka
    entrypoint: ["/bin/sh", "-c"]
    command: >
      '
      until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1; do
        echo "waiting for kafka";
        sleep 2;
      done;
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic resident-management.events --partitions 1 --replication-factor 1;
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic delivery-management.events --partitions 1 --replication-factor 1;
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic delivery-internal.commands --partitions 1 --replication-factor 1;
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic delivery-subscriber.dlq --partitions 1 --replication-factor 1;
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list;
      '
    restart: "no"

  resident-events-consumer:
    <<: *consumer
    image: entregador-resident-events-consumer
    container_name: entregador-resident-events-consumer
    command: ["./main", "-config=config/subscriber/deployments/delivery_subscriber_resident_management_events.json"]

  delivery-events-consumer:
    <<: *consumer
    image: entregador-delivery-events-consumer
    container_name: entregador-delivery-events-consumer
    command: ["./main", "-config=config/subscriber/deployments/delivery_subscriber_delivery_management_events.json"]

  internal-commands-consumer:
    <<: *consumer
    image: entregador-internal-commands-consumer
    container_name: entregador-internal-commands-consumer
    command: ["./main", "-config=config/subscriber/deployments/delivery_subscriber_internal_commands.json"]

  api:
    <<: *consumer
    build:
      context: .
      args:
        APP: api
    image: entregador-api
    container_name: entregador-api
    ports:
      - "8081:8081"
    depends_on:
      mongodb:
        condition: service_started

volumes:
  mongo_data:
