# Default (MESSAGING_PROVIDER=pubsub): MongoDB + Pub/Sub emulator + api. Same topology as Cloud Run.
#   docker compose up --build
# Kafka (MESSAGING_PROVIDER=kafka in .env): adds Kafka, Kafka UI and the worker.
#   docker compose --profile kafka up --build

x-app: &app
  build:
    context: .
    args:
      APP: api
  env_file:
    - path: .env
      required: false
  environment:
    # Inside the compose network, localhost does not reach the other containers.
    MONGODB_URI: mongodb://mongodb:27017
    DELIVERY_BROKER_HOSTS: kafka:9092
    MESSAGING_PROVIDER: ${MESSAGING_PROVIDER:-pubsub}
    GCP_PROJECT_ID: entregador-local
    PUBSUB_EMULATOR_HOST: pubsub:8085
    # The emulator does not sign push requests.
    PUBSUB_PUSH_VERIFY_TOKEN: "false"
  restart: unless-stopped

services:
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  pubsub:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    command: ["gcloud", "beta", "emulators", "pubsub", "start", "--project=entregador-local", "--host-port=0.0.0.0:8085"]
    ports:
      - "8085:8085"
    extra_hosts:
      # Lets the emulator push to an api running on the host (make infra + make api).
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # Creates the topic and the push subscription that delivers to the api, then exits.
  pubsub-init:
    image: curlimages/curl:8.10.1
    depends_on:
      - pubsub
    environment:
      PUSH_ENDPOINT: ${PUBSUB_PUSH_ENDPOINT:-http://api:8081/internal/pubsub/notifications}
    entrypoint: ["/bin/sh", "-c"]
    command: >
      '
      E=http://pubsub:8085/v1/projects/entregador-local;
      until curl -sf $$E/topics >/dev/null; do echo "waiting for pubsub"; sleep 2; done;
      curl -s -X PUT $$E/topics/delivery-notifications;
      curl -s -X PUT $$E/subscriptions/delivery-notifications-push -H "Content-Type: application/json" -d "{
        \"topic\": \"projects/entregador-local/topics/delivery-notifications\",
        \"ackDeadlineSeconds\": 60,
        \"pushConfig\": {\"pushEndpoint\": \"$$PUSH_ENDPOINT\"}
      }";
      '
    restart: "no"

  api:
    <<: *app
    image: entregador-api
    container_name: entregador-api
    ports:
      - "8081:8081"
    depends_on:
      mongodb:
        condition: service_started
      pubsub-init:
        condition: service_completed_successfully
      kafka-init-topics:
        condition: service_completed_successfully
        required: false

  kafka:
    profiles: [kafka]
    image: apache/kafka:3.9.0
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://kafka:9092,CONTROLLER://kafka:9093,PLAINTEXT_HOST://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    restart: unless-stopped

  kafka-ui:
    profiles: [kafka]
    image: provectuslabs/kafka-ui:latest
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    restart: unless-stopped

  kafka-init-topics:
    profiles: [kafka]
    image: apache/kafka:3.9.0
    depends_on:
      - kafka
    entrypoint: ["/bin/sh", "-c"]
    command: >
      '
      until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1; do
        echo "waiting for kafka";
        sleep 2;
      done;
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic delivery-internal.commands --partitions 1 --replication-factor 1;
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic delivery-subscriber.dlq --partitions 1 --replication-factor 1;
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list;
      '
    restart: "no"

  worker:
    <<: *app
    profiles: [kafka]
    build:
      context: .
      args:
        APP: worker
    image: entregador-worker
    container_name: entregador-worker
    command: ["./main", "-config=config/subscriber/deployments/delivery_subscriber_internal_commands.json"]
    depends_on:
      mongodb:
        condition: service_started
      kafka-init-topics:
        condition: service_completed_successfully

volumes:
  mongo_data:
