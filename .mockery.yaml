# Generates testify mocks for the domain interfaces: `mockery` (or `make mocks`).
# Each mock goes to a mocks/ folder next to its interface.
with-expecter: true
dir: "{{.InterfaceDir}}/mocks"
outpkg: mocks
mockname: "{{.InterfaceName}}"
filename: "{{.InterfaceName | snakecase}}.go"
disable-version-string: true
resolve-type-alias: false
issue-845-fix: true
packages:
  # Use cases, mocked by the controllers' tests.
  github.com/Moreira-Henrique-Pedro/entregador/internal/domain/interfaces/usecases:
    interfaces:
      CreateResident:
      UpdateResident:
      DeleteResident:
      ListResidents:
      RegisterDelivery:
      DeleteDelivery:
      ListDeliveries:
      NotifyDelivery:
      CreateUser:
  # Repositories and services, mocked by the use cases' tests.
  github.com/Moreira-Henrique-Pedro/entregador/internal/domain/interfaces/repositories:
    interfaces:
      ResidentRepository:
      DeliveryRepository:
  github.com/Moreira-Henrique-Pedro/entregador/internal/domain/interfaces/services:
    interfaces:
      Notifier:
      NotificationScheduler:
      TokenVerifier:
      UserRegistry:
  github.com/Moreira-Henrique-Pedro/entregador/internal/infrastructure/repositories/mongodb/client:
    interfaces:
      MongoClientCollectionPort:
