# Generates testify mocks for the ports: `mockery` (or `make mocks`).
# Each mock goes to a mocks/ folder next to its interface.
with-expecter: true
dir: "{{.InterfaceDir}}/mocks"
outpkg: mocks
mockname: "{{.InterfaceName}}"
filename: "{{.InterfaceName | snakecase}}.go"
disable-version-string: true
resolve-type-alias: false
issue-845-fix: true
packages:
  # Driving ports (use cases), mocked by the inbound adapters' tests.
  github.com/Moreira-Henrique-Pedro/entregador/internal/application/ports/in:
    interfaces:
      CreateResident:
      UpdateResident:
      DeleteResident:
      ListResidents:
      RegisterDelivery:
      DeleteDelivery:
      ListDeliveries:
      NotifyDelivery:
  # Driven ports, mocked by the use cases' tests.
  github.com/Moreira-Henrique-Pedro/entregador/internal/application/ports/out:
    interfaces:
      ResidentRepository:
      DeliveryRepository:
      Notifier:
      NotificationScheduler:
  github.com/Moreira-Henrique-Pedro/entregador/internal/adapters/out/mongodb/client:
    interfaces:
      MongoClientCollectionPort:
  github.com/Moreira-Henrique-Pedro/entregador/pkg/pubsub:
    interfaces:
      MessagePublisher:
  # External interface: its mock lives next to the adapter that uses it.
  github.com/ThreeDotsLabs/watermill/message:
    config:
      dir: pkg/watermill/mocks
    interfaces:
      Publisher:
